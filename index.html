<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O'zbekiston temir yo'llari</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      .main-image {
        display: block;
        width: 100%;
        height: auto;
        transform: scale(var(--image-scale, 1));
        transform-origin: center;
      }

      .image-viewport {
        overflow: hidden;
        touch-action: pan-y;
      }

      .actions {
        display: grid;
        gap: 12px;
        padding: 12px;
      }

      .action-button {
        display: block;
        width: 100%;
        padding: 16px;
        border: 0;
        background: #198754;
        color: #fff;
        font: inherit;
        font-size: 18px;
        cursor: pointer;
      }

      .action-button:hover {
        background: #157347;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="image-viewport">
        <img class="main-image" src="Toshkent-Samarqand.png" alt="Asosiy rasm" />
      </div>
      <div class="actions">
        <button
          class="action-button"
          type="button"
          onclick="downloadImage()"
        >
          E-check
        </button>
        <button class="action-button" type="button" onclick="window.close()">
          Yopish
        </button>
      </div>
    </main>
    <script>
      const imageViewport = document.querySelector(".image-viewport");
      const image = document.querySelector(".main-image");
      const pointers = new Map();
      let startDistance = 0;
      let startScale = 1;
      let scale = 1;

      function downloadImage() {
        const link = document.createElement("a");
        link.href = image.src;
        link.download = image.src.split("/").pop().split("?")[0] || "rasm.jpg";
        link.click();
      }

      imageViewport.addEventListener("pointerdown", (event) => {
        pointers.set(event.pointerId, event);
        imageViewport.setPointerCapture(event.pointerId);

        if (pointers.size === 2) {
          const [first, second] = pointers.values();
          startDistance = Math.hypot(
            first.clientX - second.clientX,
            first.clientY - second.clientY,
          );
          startScale = scale;
        }
      });

      imageViewport.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId)) return;
        pointers.set(event.pointerId, event);
        if (pointers.size !== 2 || startDistance === 0) return;

        const [first, second] = pointers.values();
        const distance = Math.hypot(
          first.clientX - second.clientX,
          first.clientY - second.clientY,
        );
        scale = Math.min(
          5,
          Math.max(1, startScale * (distance / startDistance)),
        );
        image.style.setProperty("--image-scale", scale);
      });

      function stopPinching(event) {
        pointers.delete(event.pointerId);
        if (pointers.size < 2) startDistance = 0;
      }

      imageViewport.addEventListener("pointerup", stopPinching);
      imageViewport.addEventListener("pointercancel", stopPinching);
    </script>
  </body>
</html>
